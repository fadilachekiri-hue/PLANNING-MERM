name: Garder Supabase actif

# Évite la mise en pause automatique du projet Supabase (plan gratuit : pause
# après ~7 jours sans activité) en visitant l'application tous les jours.
# Déclenche un vrai appel à Supabase Auth via le middleware de l'application.
on:
  schedule:
    - cron: "0 7 * * *" # tous les jours à 7h UTC
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visiter l'application
        run: curl -fsS -o /dev/null https://planning-merm.vercel.app/connexion
